name: Issue 32 WFS diagnostics

on:
  push:
    branches:
      - issue-32-wfs-diagnostics

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 5

    steps:
      - name: Probe Helsinki WFS from Intel macOS GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail

          url='https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=avoindata%3APuurekisteri_piste&outputFormat=application%2Fjson&srsName=EPSG%3A4326&count=1&startIndex=0&sortBy=id'
          format='dns=%{time_namelookup}s tcp=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s status=%{http_code} remote_ip=%{remote_ip}\n'

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 60 \
            --output /dev/null \
            --write-out "$format" \
            "$url"
