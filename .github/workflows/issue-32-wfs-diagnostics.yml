name: Issue 32 WFS diagnostics

on:
  push:
    branches:
      - issue-32-wfs-diagnostics

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect HRI metadata for an alternate official delivery path
        shell: bash
        run: |
          set -euo pipefail

          api='https://hri.fi/data/api/action/package_show?id=helsingin-kaupungin-puurekisteri'
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 30 \
            --user-agent 'Mozilla/5.0 (compatible; trees-helsinki-diagnostics/1.0)' \
            --header 'accept: application/json' \
            "$api")"

          printf '%s' "$response" | jq '{success, resources: [.result.resources[] | {id, name, format, url, cache_url, datastore_active, url_type}]}'
