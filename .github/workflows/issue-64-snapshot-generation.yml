name: Generate issue 64 mobile baselines

on:
  push:
    branches:
      - issue-64-mobile-sheet-dismissal

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate mobile visual baselines
        run: npx playwright test e2e/mobile-visual-regression.spec.ts --update-snapshots

      - name: Commit regenerated baselines and remove generator
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/mobile-visual-regression.spec.ts-snapshots/
          git rm .github/workflows/issue-64-snapshot-generation.yml
          git commit -m "test: update mobile visual baselines"
          git push origin HEAD:issue-64-mobile-sheet-dismissal
