name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build production app
        run: npm run build

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host

    steps:
      - name: Check out issue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Linux visual baselines
        run: npm run test:e2e -- e2e/mobile-visual-regression.spec.ts --update-snapshots=all

      - name: Commit generated visual baselines
        if: github.event_name == 'pull_request' && github.head_ref == 'issue-43-mobile-ui-regression-tests'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/mobile-visual-regression.spec.ts-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "test: add approved mobile visual baselines"
            git push origin HEAD:${{ github.head_ref }}
          fi
